# SpanGuard/CentralCache::verify_free_patterns verify every central-free object reads as
# FREE_PATTERN under junk-fill, in the engine oracle; (3) a deterministic self-consistency
# replay test (same-seed byte-identical trace, different-seed differs) closing the W19-3
# acceptance; (4) LeakSanitizer on the real-allocator C-ABI pass + xtask/lsan-suppressions.txt;
