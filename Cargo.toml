# SPDX-License-Identifier: MIT
#
# TopoMalloc Cargo workspace (W0-4, D3). `cargo xtask` is the single entry
# point driving Rust, Lean (`lake`), codegen, and cross builds so contributors
# and CI run identical commands.
#
# Licensing (D5, W0-12): the workspace default is MIT. The seLe4n integration
# crates (`topo-backend-sele4n`) are GPL-3.0-or-later because they link the
# GPLv3 seLe4n ABI. They are never linked by the default MIT artifact; see
# NOTICE and docs/DECISIONS.md.
[workspace]
resolver = "2"
members = [
    "crates/topo-core",
    "crates/topo-abi",
    "crates/topo-backend-posix",
    "crates/topo-backend-sele4n",
    "crates/topo-arch",
    "crates/topo-stats",
    "crates/topo-control",
    "crates/topo-test-support",
    "tools/size-class-gen",
    "tools/trace-replay",
    "tests",
    "xtask",
]
# `fuzz/` is intentionally excluded: cargo-fuzz requires a nightly toolchain and
# its own workspace (W0-7). It is built on demand by `xtask test --kind fuzz`.
# `vendor/sele4n` is the pinned, GPL-3.0-or-later seLe4n ABI mirror (D8): its own
# workspace, so its upstream `*.workspace` inheritance resolves there (not against
# this MIT root). It is linked only by `topo-backend-sele4n --features real-abi`.
exclude = ["fuzz", "vendor/sele4n"]

[workspace.package]
# 0.1.1: W9 (plan 06) adds the arena lifecycle/authority/handle/configure
# surface. 0.1.3: W11 (plan 04) adds the hugepage-aware backend (filler / huge
# cache / region cache + §19.7 coverage stats). 0.1.8: W13 (plan 04) hardens the
# §15.4 cross-domain rebalancer to move only a donor's *surplus* (never stranding
# it) + `NodePressure::unmet_need`/`movable_surplus` accessors. 0.1.9: W13 live
# integration — the `NodeRouter` (per-node hugepage backends + best-effort `mbind`)
# makes placement/rebalancing affect real allocations, wired into the
# `hugepage-optimized` ABI. 0.1.10: W13 audit — read the arena NUMA policy lock-free
# on the alloc path (an `AtomicU64`, like `hook_slot`), don't count a NO_HUGEPAGE
# decline as rebalancer demand, and make the built distance diagonal local for every
# slot. 0.1.11: make `HugePageBackend::owns_addr` overflow-free. 0.1.12: W13 optimal
# completion — genuine first-touch (an unbound default backend for OsDefault), real
# `sched_getcpu` `Local`, nearest-node spillover, W12 `release_idle`, and the
# host-driven `topomalloc_numa_*` C control surface; removed the now-dead filler NUMA
# score term. 0.1.13: W13 audit — `TopologyBuilder::build` now densely renumbers the
# LLC-domain ids too (not just NUMA nodes), so the documented no-phantom-domain invariant
# holds for *any* builder caller (not only the sysfs reader) and `llc_count()`/stats stay
# exact on a sparsely-numbered LLC space; dropped the now-dead `max_node`/`max_llc` builder
# fields. 0.1.17: W15-3b (plan 06) completes in-place realloc **shrink** — a
# medium/large shrink across a page boundary now splits off and returns the tail
# pages to the backend (§25.3), via `ExtentManager::split_tail` +
# `LargeAllocator::shrink` + `LargeDescriptor::shrink_usable`, with exact
# `live_bytes`/arena-quota accounting and the in-place semantics still best-effort
# (cache-served / exhausted-split keep the allocation whole). 0.1.18: formal-obligation
# review (the W15-3b lesson) — pin every "policy, no Lean obligation" claim with a cited
# artifact: the `realloc_shrink_inplace_tail_tiles_disjointly` theorem (W15-3b), the
# `placement_never_breaks_the_allocation_contract` fixed wall (W13), and the
# `controller_driven_release_preserves_live_objects` end-to-end test (W12); plus a new
# `cargo xtask lint` gate (`obligation citations (V-004)`) that fails a bare claim. 0.1.19:
# W15 optimal completion (all units, no deferrals) — extent-merge in-place *grow*
# (`grow_in_place`/`absorb_next_in`, pinned by `realloc_grow_inplace_absorbs_disjointly`);
# `xallocx` in-place resize (`resize_in_place`); calloc `memset` elision over freshly-
# OS-zeroed extents (`committed_memory_is_zeroed`); cache-served hugepage tail-trim
# (`HugePageFiller::trim` via `RegionCacheHook::try_trim`); aligned size classes (the
# generated table records each class's natural alignment ⇒ MAX_ALIGN = page size, no Lean
# proof change); and `valloc`/`pvalloc`. In a 0.x series new backwards-compatible
# functionality is a patch bump (the 0.x minor is the breaking axis), keeping `^0.1.0`
# inter-crate reqs satisfied.
version = "0.1.19"
edition = "2021"
rust-version = "1.94"
repository = "https://github.com/hatter6822/topomalloc"
authors = ["The TopoMalloc Authors"]

# Shared lint policy (W0-6). `clippy -D warnings` is applied in CI on top of
# these; here we raise the floor for every crate so a fresh crate inherits the
# house rules. Crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2021_compatibility = "warn"
# `--cfg loom` is a recognized, opt-in configuration for the `loom` model-check
# tests (run only under `RUSTFLAGS="--cfg loom"`); declare it so the default build's
# `unexpected_cfgs` lint does not flag the `#![cfg(loom)]`-gated test files.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
# Correctness-leaning groups; policy/heavy groups stay opt-in per crate.
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
ptr_as_ptr = "warn"
checked_conversions = "warn"

[profile.release]
# Performance profile is the optimized build; debug assertions are gated by
# feature, not by profile (principle 8: profiles are features, not forks).
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
