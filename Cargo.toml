# makes placement/rebalancing affect real allocations, wired into the
# `hugepage-optimized` ABI. 0.1.10: W13 audit — read the arena NUMA policy lock-free
# on the alloc path (an `AtomicU64`, like `hook_slot`), don't count a NO_HUGEPAGE
# decline as rebalancer demand, and make the built distance diagonal local for every
# slot. 0.1.11: make `HugePageBackend::owns_addr` overflow-free. 0.1.12: W13 optimal
# completion — genuine first-touch (an unbound default backend for OsDefault), real
# `sched_getcpu` `Local`, nearest-node spillover, W12 `release_idle`, and the
# host-driven `topomalloc_numa_*` C control surface; removed the now-dead filler NUMA
# score term. 0.1.13: W13 audit — `TopologyBuilder::build` now densely renumbers the
# LLC-domain ids too (not just NUMA nodes), so the documented no-phantom-domain invariant
# holds for *any* builder caller (not only the sysfs reader) and `llc_count()`/stats stay
# exact on a sparsely-numbered LLC space; dropped the now-dead `max_node`/`max_llc` builder
# fields. 0.1.17: W15-3b (plan 06) completes in-place realloc **shrink** — a
# medium/large shrink across a page boundary now splits off and returns the tail
# pages to the backend (§25.3), via `ExtentManager::split_tail` +
