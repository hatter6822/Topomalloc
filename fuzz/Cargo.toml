# SPDX-License-Identifier: MIT
# cargo-fuzz harness (W0-7, §34.8). A standalone workspace: cargo-fuzz requires a
# nightly toolchain + libFuzzer, so it is excluded from the main workspace and
# built on demand by `xtask test --kind fuzz` (or the nightly CI fuzz job).
[package]
name = "topomalloc-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
topo-core = { path = "../crates/topo-core" }

[[bin]]
name = "classify"
path = "fuzz_targets/classify.rs"
test = false
doc = false
bench = false

# Standalone workspace so cargo-fuzz does not inherit the parent workspace.
[workspace]
