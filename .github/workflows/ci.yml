# SPDX-License-Identifier: MIT
#
# TopoMalloc CI (W0-5). Guiding rule: every job calls `cargo xtask` verbatim —
# no build logic lives only in this YAML, so `cargo xtask ci` reproduces CI
# locally. The job graph mirrors the plan (W0-5a..f) and is additive per
# milestone. Configure these as required status checks on the protected branch
# so a red job blocks merge.
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # G-build (static half): rustfmt + clippy -D warnings + SPDX + Lean style +
  # license boundary + markdownlint + shellcheck + cargo-deny (all via xtask).
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install markdownlint
        run: npm install -g markdownlint-cli2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo xtask fmt --check
      - run: cargo xtask lint

  # G-table: the generated tables match the golden (single source of truth, DD-1).
  gen-golden-diff:
    name: gen-golden-diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask gen --check

  # G-build: {x86-64, aarch64} x {debug, performance}. AArch64 is co-primary,
  # cross-linked here and run under QEMU in the `test` job (DD-2).
  build:
    name: build (${{ matrix.target }}, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
        profile: [debug, performance]
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.profile }}
      - name: Install AArch64 cross toolchain (linker + dev libc)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build (retry once on AArch64 infra flake, DD-2)
        run: |
          attempt() { cargo xtask build --target ${{ matrix.target }} --profile ${{ matrix.profile }}; }
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            attempt || { echo "::warning::AArch64 build flaked; retrying once (DD-2)"; attempt; }
          else
            attempt
          fi
      # Guard the Darwin (Apple) `madvise` cfg branch (`MADV_FREE_REUSABLE`, §20.4):
      # metadata-only cross-`cargo check` so it cannot bit-rot. Once per workflow.
      - name: Check Darwin (Apple madvise cfg branch)
        if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.profile == 'debug'
        run: rustup target add x86_64-apple-darwin && cargo check -p topo-backend-posix --target x86_64-apple-darwin

  # G-core: tests on both arches; AArch64 runs under qemu-user (the asm/RSEQ
  # battery lands here from plan 05). The host run also exercises the seLe4n
  # simulator vertical slice (G-sim).
  test:
    name: test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.target }}
      - name: Install AArch64 runtime (cross linker + dev libc + qemu-user)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user qemu-user-static
      # The AArch64 suite runs under qemu-user, which `xtask test --target` forces
      # single-threaded to dodge a qemu 8.2.x /proc/self/maps thread-safety crash
      # (fixed upstream in qemu >= 9.0.4, commit bbd5630a75e7; see xtask `test`).
      # The retry stays as a secondary net for genuine infra flakes (DD-2).
      - name: Test (AArch64 under qemu-user; retry once on infra flake, DD-2)
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cargo xtask test   # host: includes the G-sim vertical slice
          else
            attempt() { cargo xtask test --target ${{ matrix.target }}; }
            attempt || { echo "::warning::AArch64 test flaked; retrying once (DD-2)"; attempt; }
          fi

  # G-fast (AArch64 real RSEQ): qemu-user does NOT emulate rseq, so the `test`
  # job above only exercises the AArch64 *fallback* + the asm logic (explicit
  # area). A native arm64 runner has a real ARM kernel, so glibc registers rseq
  # and the AArch64 sequences run with real preemption/migration — the only place
  # the W7-3c restart property is truly validated (DD-2: "QEMU where needed", the
  # rest on real hardware). Requires GitHub's arm64 runners (free for public
  # repos; billed for private — drop this job if undesired).
  test-arm64-native:
    name: test (aarch64 native, real RSEQ)
    runs-on: ubuntu-24.04-arm
    # The repo's .cargo/config.toml sets a `qemu-aarch64` runner for the
    # aarch64 target (for x86->arm64 cross runs). On a NATIVE arm64 host that
    # target *is* the host, so cargo would route `run`/`test` through qemu
    # (which isn't installed, and would defeat the purpose — qemu-user doesn't
    # emulate rseq). Override the runner with an `env` passthrough so the native
    # binaries execute directly; scoped to this job only.
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: env
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: arm64-native
      # Native build/run on aarch64: rseq is active, so the restartable sequences
      # and the forced-migration equivalence exercise the real kernel mechanism.
      - run: cargo xtask test --kind rseq
      - run: cargo test -p topo-core --test rseq_equivalence --test pinned_core

  # G-conc (TSan): the W6/W7 concurrency tests run under ThreadSanitizer (DoD
  # addendum). Nightly is opt-in for the allocator (like cargo-fuzz); this job
  # installs it just for `-Zsanitizer=thread` + `-Zbuild-std`. The RSEQ assembly
  # interior is a TSan blind spot (covered by the forced-migration conservation
  # tests); TSan validates the locked path, the atomics, and the W7-4 lock/fence
  # coordination.
  tsan:
    name: tsan (concurrency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install nightly + rust-src (for the sanitizer)
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: tsan
      - run: cargo xtask test --kind tsan

  # ABI compatibility (§34.1): compile + link + run the C harness against the
  # generated header and the staticlib.
  abi-test:
    name: abi-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask abi-test

  # rustdoc with -D warnings (broken intra-doc links fail the build).
  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask doc

  # G-build -> G-model: the Lean model builds and `lake exe check` passes. Lean
  # is installed via the repo's direct-download script (robust behind egress
  # gateways; the same script `xtask setup` uses).
  lean:
    name: lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: lean
      - name: Install zstd (toolchain archive format)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: lean-${{ hashFiles('lean-toolchain') }}
      - name: Install pinned Lean toolchain
        run: bash scripts/setup_lean.sh
      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lean/**/*.lean') }}
      - run: cargo xtask lean

  # Non-gating until plan 10: the mdbook site builds.
  docs:
    name: docs (non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install mdbook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build docs
