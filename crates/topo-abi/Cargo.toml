# SPDX-License-Identifier: MIT
[package]
name = "topo-abi"
description = "C ABI exports (topomalloc_*) + the Rust GlobalAlloc adapter. The default artifact is MIT/POSIX-only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license = "MIT"

[lib]
# rlib for in-tree consumers/tests; cdylib + staticlib for deployment (§35.1).
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# `std` is enabled because `topo-abi` is the hosted (std) artifact: it activates
# topo-core's thread-local safety machinery — the W16-1b lock-order checker (debug
# only), the S-007 bootstrap re-entrancy guard, and the W16-6 extent-hook
# re-entrancy guard — in the real allocator, not just in topo-core's own tests.
# The `no_std` hot-path capability is preserved for the kernel/seLe4n target,
# which builds topo-core *without* this feature.
topo-core = { path = "../topo-core", version = "0.2.0", features = ["std"] }
topo-backend-posix = { path = "../topo-backend-posix", version = "0.2.0" }
# The pure stats renderer (Appendix-D JSON / §31.6 explain / §36.12 redaction). The C
# `topomalloc_stats_*` surface composes a live snapshot and hands it to this renderer.
topo-stats = { path = "../topo-stats", version = "0.2.0" }
# GPL backend is optional and OFF by default; enabling `sele4n-sim` produces a
# GPL-3.0-or-later artifact (libtopomalloc-sele4n, §36.3.2). See NOTICE.
topo-backend-sele4n = { path = "../topo-backend-sele4n", version = "0.2.0", optional = true }

# errno + allocation-free getenv for the §10.1 errno protocol and the W8-4
# zero-size policy (unix only; the same MIT/Apache-2.0 dep topo-backend-posix
# uses). Non-unix hosts compile the no-op errno shim instead.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
sele4n-sim = ["dep:topo-backend-sele4n"]
# The `hugepage_optimized` profile (plan 04 W11): the global POSIX allocator serves
# its medium/large path from a hugepage backend. Off by default (the M1 extent path).
hugepage-optimized = ["topo-core/hugepage-optimized"]
# W18 (plan 08, §29) hardening profiles, surfaced so a deployable `libtopomalloc`
# can be built hardened/debug and the ABI exercised under them. Composed from this
# crate's own granular units (each forwarding to `topo-core`) so that `topo-abi`'s
# `cfg!(feature = "…")` gates are accurate under the profile, not just `topo-core`'s.
# The default MIT/POSIX artifact enables none.
hardened = [
    "topo-core/hardened",
    "junk-fill",
    "quarantine",
    "guard-pages",
    "secure-scrub",
]
debug = ["topo-core/debug", "junk-fill"]
# The individual W18 units, forwarded so a deployment can opt into one protection
# without the whole profile (e.g. just delayed-reuse quarantine).
junk-fill = ["topo-core/junk-fill"]
quarantine = ["topo-core/quarantine"]
guard-pages = ["topo-core/guard-pages"]
secure-scrub = ["topo-core/secure-scrub"]

[dev-dependencies]
# Micro-benchmark harness (W0-8, §34.6). Default features (rayon, plotters, and
# their wasm/web transitive deps) are dropped to shrink the supply-chain surface;
# `cargo_bench_support` is kept so the benches integrate with `cargo bench`.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Assert the composed stats JSON is well-formed and reconciles (W17 stats tests).
serde_json = "1"

[[bench]]
name = "alloc"
harness = false

[lints]
workspace = true
