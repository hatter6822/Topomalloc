# SPDX-License-Identifier: MIT
[package]
name = "topo-core"
description = "TopoMalloc core: classifier, size classes, the backing-provider seam, the back-end extent manager, and the M0 skeleton allocator. no_std-capable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license = "MIT"

[features]
default = []
# Pull in `std` (only the test harness needs it; the crate is otherwise no_std).
# Also enables `topo-arch/std` so the RSEQ self-registration fallback (W7-1) has
# its `thread_local!` area storage in hosted builds.
std = ["topo-arch/std"]
# Debug/hardened invariant checks (Appendix B) compiled in.
debug-checks = []
# --- W18 security & hardening units (plan 08, §29/§17.3/§36.12). Each protection
# is its **own opt-in, profile-gated unit** so the `performance` profile pays for
# none of them (every entry point compiles to a no-op without its feature) and the
# `hardened`/`debug` profiles *compose* the ones they want. See `crate::harden`. ---
# W18-5: junk filling — fill-on-alloc / fill-on-free / verify-on-reuse (§29.6).
junk-fill = []
# W18-3: delayed-reuse quarantine for freed objects (§29.4).
quarantine = []
# W18-4: sampled guarded allocations — inaccessible guard pages (§29.5).
guard-pages = []
# W18-6: scrub dirty memory before it is reused across a security label (§36.12).
secure-scrub = []
# Profiles are features, not forks (overview principle 8; §30.1). Each selects a
# feature set; their behaviour is filled in as subsystems land (plans 04/05/08).
# See profiles/README.md for the full mapping.
hardened = ["debug-checks", "junk-fill", "quarantine", "guard-pages", "secure-scrub"]
debug = ["debug-checks", "junk-fill"]
deterministic-test = []
low-rss = []
hugepage-optimized = []

[dependencies]
# Per-architecture RSEQ restartable sequences + registration (W7, plan 05). The
# only crate the per-CPU fast path reaches into; `no_std`, no transitive deps.
# The explicit `version` (not a bare path) matches every other inter-crate dep
# and keeps `cargo deny` happy: `topo-core` is publishable, and a wildcard path
# dep is disallowed for public crates.
topo-arch = { path = "../topo-arch", version = "0.1.0" }

[dev-dependencies]
# Micro-benchmark harness (W0-8, §34.6) for the W3 metadata paths. Default features
# (rayon, plotters, and their wasm/web transitive deps) are dropped to shrink the
# supply-chain surface; `cargo_bench_support` is kept for `cargo bench`.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# `loom` exhaustively model-checks the lock-free concurrency protocols (W3-3c
# publish/read and the W3-4 seqlock). Gated to `--cfg loom` so it — and its heavy
# transitive deps — are invisible to the normal build, test, and supply-chain audit;
# run with `RUSTFLAGS="--cfg loom" cargo test -p topo-core --test loom_protocols`.
[target.'cfg(loom)'.dev-dependencies]
# Default features (the `tracing-subscriber` checkpoint UI and its transitive deps)
# are dropped to keep the supply-chain surface minimal; the model checker itself
# needs none of them.
loom = { version = "0.7", default-features = false }

[[bench]]
name = "metadata"
harness = false

[[bench]]
name = "extent"
harness = false

[[bench]]
name = "cpu_cache"
harness = false

[[bench]]
name = "huge"
harness = false

[[bench]]
name = "fork_gate"
harness = false

[lints]
workspace = true
