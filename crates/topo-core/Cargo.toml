# SPDX-License-Identifier: MIT
[package]
name = "topo-core"
description = "TopoMalloc core: classifier, size classes, the backing-provider seam, and the M0 skeleton allocator. no_std-capable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license = "MIT"

[features]
default = []
# Pull in `std` (only the test harness needs it; the crate is otherwise no_std).
std = []
# Debug/hardened invariant checks (Appendix B) compiled in.
debug-checks = []
# Profiles are features, not forks (overview principle 8; §30.1). Each selects a
# feature set; their behaviour is filled in as subsystems land (plans 04/05/08).
# See profiles/README.md for the full mapping.
hardened = ["debug-checks"]
debug = ["debug-checks"]
deterministic-test = []
low-rss = []
hugepage-optimized = []

[dependencies]

[lints]
workspace = true
