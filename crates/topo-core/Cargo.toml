# SPDX-License-Identifier: MIT
[package]
name = "topo-core"
description = "TopoMalloc core: classifier, size classes, the backing-provider seam, the back-end extent manager, and the M0 skeleton allocator. no_std-capable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license = "MIT"

[features]
default = []
# Pull in `std` (only the test harness needs it; the crate is otherwise no_std).
# Also enables `topo-arch/std` so the RSEQ self-registration fallback (W7-1) has
# its `thread_local!` area storage in hosted builds.
std = ["topo-arch/std"]
# Debug/hardened invariant checks (Appendix B) compiled in.
debug-checks = []
# Profiles are features, not forks (overview principle 8; §30.1). Each selects a
# feature set; their behaviour is filled in as subsystems land (plans 04/05/08).
# See profiles/README.md for the full mapping.
hardened = ["debug-checks"]
debug = ["debug-checks"]
deterministic-test = []
low-rss = []
hugepage-optimized = []

[dependencies]
# Per-architecture RSEQ restartable sequences + registration (W7, plan 05). The
# only crate the per-CPU fast path reaches into; `no_std`, no transitive deps.
topo-arch = { path = "../topo-arch" }

[dev-dependencies]
# Micro-benchmark harness (W0-8, §34.6) for the W3 metadata paths. Default features
# (rayon, plotters, and their wasm/web transitive deps) are dropped to shrink the
# supply-chain surface; `cargo_bench_support` is kept for `cargo bench`.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# `loom` exhaustively model-checks the lock-free concurrency protocols (W3-3c
# publish/read and the W3-4 seqlock). Gated to `--cfg loom` so it — and its heavy
# transitive deps — are invisible to the normal build, test, and supply-chain audit;
# run with `RUSTFLAGS="--cfg loom" cargo test -p topo-core --test loom_protocols`.
[target.'cfg(loom)'.dev-dependencies]
# Default features (the `tracing-subscriber` checkpoint UI and its transitive deps)
# are dropped to keep the supply-chain surface minimal; the model checker itself
# needs none of them.
loom = { version = "0.7", default-features = false }

[[bench]]
name = "metadata"
harness = false

[[bench]]
name = "extent"
harness = false

[lints]
workspace = true
