# SPDX-License-Identifier: GPL-3.0-or-later
#
# This crate is the seLe4n backend. It is GPL-3.0-or-later (D5, W0-12): at M1 it
# links the GPLv3 `sele4n-abi`/`sele4n-types` crates, so the license boundary is
# drawn here, before the first byte of seLe4n-linked code (W0-12 best practice).
# The default MIT TopoMalloc artifact never links this crate.
[package]
name = "topo-backend-sele4n"
description = "Sele4nSim + Sele4nBackingProvider over the real seLe4n ABI. Separately licensed (GPL-3.0-or-later)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license = "GPL-3.0-or-later"
# Not a crates.io publish target: under `real-abi` it links vendored, path-only GPL
# crates (`vendor/sele4n/**`) that are not on crates.io, so publishing is impossible
# by construction. Marking it private also lets cargo-deny's `allow-wildcard-paths`
# accept the versionless intra-workspace path deps on it (D8 supply-chain plumbing).
publish = false

[dependencies]
topo-core = { path = "../topo-core", version = "0.4.0" }

# D8 — the real seLe4n ABI, pinned to the reviewed SHA (vendor/sele4n/PINNED_SHA) and
# vendored under `vendor/sele4n/` by `scripts/vendor_sele4n.sh` (GPL-3.0-or-later, on
# the seLe4n side of the D5 boundary). These are **optional** path deps, pulled in
# ONLY under `--features real-abi` — so the default build resolves nothing from the
# mirror, stays hermetic (no git fetch, no crates.io), and the MIT default artifact
# links no GPL. `topo-backend-sele4n` is itself GPL, so these GPL deps sit on the
# correct side of the boundary. Path (not git) deps keep the real-abi build offline
# and reproducible against the committed pin.
sele4n-types = { path = "../../vendor/sele4n/sele4n-types", version = "0.31.50", optional = true }
sele4n-abi = { path = "../../vendor/sele4n/sele4n-abi", version = "0.31.50", optional = true }

[features]
default = []
# Compile the provider against the pinned, vendored real seLe4n ABI (D8, plan 09
# W22-0). This links the `KernelError -> BackendError` bridge (the seam that
# type-checks vs the pinned upstream, W4-1); the full `Sele4nBackingProvider` over
# real frame/untyped capabilities grows here in plan 09.
real-abi = ["dep:sele4n-types", "dep:sele4n-abi"]

[lints]
workspace = true
