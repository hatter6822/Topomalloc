# SPDX-License-Identifier: GPL-3.0-or-later
#
# This crate is the seLe4n backend. It is GPL-3.0-or-later (D5, W0-12): at M1 it
# links the GPLv3 `sele4n-abi`/`sele4n-types` crates, so the license boundary is
# drawn here, before the first byte of seLe4n-linked code (W0-12 best practice).
# The default MIT TopoMalloc artifact never links this crate.
[package]
name = "topo-backend-sele4n"
description = "Sele4nSim + (at M1) Sele4nBackingProvider over the real seLe4n ABI. Separately licensed (GPL-3.0-or-later)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license = "GPL-3.0-or-later"

[dependencies]
topo-core = { path = "../topo-core", version = "0.1.0" }

# D8 — the real seLe4n ABI is pinned to a reviewed SHA and vendored on demand by
# `scripts/vendor_sele4n.sh` into `vendor/sele4n/` (gitignored, GPL-3.0-or-later).
# It is NOT a committed dependency at M0: a committed (even optional) path/git dep
# would make the default build resolve the vendored manifests, eroding the hermetic
# build and pulling a GPL tree into the MIT-default repo before its time. Wiring
# `--features real-abi` against the vendored crates is plan 09 W22-0; the seam was
# *verified* to compile against the pinned ABI (see docs/DECISIONS.md §D8). To wire
# locally: run the vendor script, add `vendor/sele4n` to the root `exclude`, and:
#   sele4n-types = { path = "../../vendor/sele4n/sele4n-types", optional = true }
#   sele4n-abi   = { path = "../../vendor/sele4n/sele4n-abi",   optional = true }
#   real-abi = ["dep:sele4n-types", "dep:sele4n-abi"]

[features]
default = []
# Reserved for plan 09 W22-0: compile the provider against the pinned, vendored real
# seLe4n ABI (verified working against the pin this session; see docs/DECISIONS.md).
real-abi = []

[lints]
workspace = true
