# SPDX-License-Identifier: MIT
#
# Cross-crate integration tests (repo layout `/tests`). The default build is
# MIT/POSIX-only; the `sele4n-sim` feature additionally links the GPL seLe4n
# backend for the dual-backend (G-sim) test and yields GPL test binaries.
[package]
name = "topo-tests"
description = "Cross-crate integration, ABI, and property tests (plan 08)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
sele4n-sim = ["dep:topo-backend-sele4n", "topo-abi/sele4n-sim"]
# Run the integration suite's engine sweeps — `Allocator::check_invariants`, now
# including the W19-1a pagemap↔descriptor and W19-1c redzone checks — with the
# Appendix-B runtime assertions live (the §17.3 integrity tag, the per-transition
# B.3 `debug_assert!`s). This exercises the on-demand B.1/B.3/B.5 oracles across
# real end-to-end malloc/free/realloc sequences in CI (W19-1a "runs in debug CI"),
# not only topo-core's own unit tests.
debug-checks = ["topo-core/debug-checks"]
# W18 hardening profiles, so the integration suite can exercise the live guarded
# allocations (real `mprotect` trap), quarantine, scrub, and junk fill over the
# POSIX / seLe4n providers (plan 08).
hardened = ["topo-abi/hardened", "guard-pages", "quarantine", "secure-scrub", "junk-fill"]
guard-pages = ["topo-abi/guard-pages"]
quarantine = ["topo-abi/quarantine"]
secure-scrub = ["topo-abi/secure-scrub", "topo-core/secure-scrub"]
junk-fill = ["topo-abi/junk-fill", "topo-core/junk-fill"]

[dependencies]
# `std` so the integration tests exercise topo-core's thread-local safety
# machinery (the W16-1b lock-order checker in debug, the W16-6 hook re-entrancy
# guard) — `topo-abi` enables it too, but this crate also uses `topo_core`
# directly. See the note in `crates/topo-abi/Cargo.toml`.
topo-core = { path = "../crates/topo-core", features = ["std"] }
topo-abi = { path = "../crates/topo-abi" }
topo-backend-posix = { path = "../crates/topo-backend-posix" }
topo-backend-sele4n = { path = "../crates/topo-backend-sele4n", optional = true }
topo-stats = { path = "../crates/topo-stats" }
topo-control = { path = "../crates/topo-control" }
topo-test-support = { path = "../crates/topo-test-support" }

[dev-dependencies]
proptest = "1"
# Validates the §31.3 profile-dump JSON in the W14 placement integration tests
# (test-only; the same dep topo-stats uses for its JSON assertions).
serde_json = "1"

[lints]
workspace = true

# errno constants for the W8-1b errno-discipline assertions (unix only).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
